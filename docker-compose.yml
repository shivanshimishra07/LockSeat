services:
  db:
    image: postgres:15-alpine
    container_name: reservation_db
    command: postgres -c max_connections=300
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: reservation_db
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - ./loadtest:/loadtest:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reservation_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: reservation_redis
    ports:
      - "${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@db:5432/reservation_db
      REDIS_URL: redis://redis:6379/0
      DB_POOL_MIN_SIZE: "10"
      DB_POOL_MAX_SIZE: "40"
      HOLD_SECONDS: ${HOLD_SECONDS:-300}
      SWEEPER_INTERVAL_SECONDS: ${SWEEPER_INTERVAL_SECONDS:-10}
    ports:
      - "${APP_HOST_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy